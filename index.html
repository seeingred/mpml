<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141516" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any">
  <title>Music, over time</title>
  <link rel="stylesheet" href="preview.css">
  <script src="players.js" defer></script>
  <script src="timeline.js" defer></script>
  <script src="overlays.js" defer></script>
  <script src="scrubbing.js" defer></script>
  <script src="preview.js" defer></script>
</head>
<body>
  <main>
    <section id="setup" class="setup" aria-label="Choose your song">
      <label class="choose" for="file">Choose a song</label>
      <input id="file" class="visually-hidden" type="file" accept="audio/*">
      <p id="filename" class="filename" hidden></p>
      <button id="start" class="start" type="button" hidden disabled>Play</button>
      <div class="demo-option"><span>or</span> <button id="demo" class="demo" type="button">play demo</button></div>
    </section>

    <section id="journey" class="journey" aria-label="Music player journey" hidden>
      <div id="stage" class="stage" role="img" aria-label="Winamp 2"></div>
      <footer class="transport">
        <p class="caption"><span id="player-name"></span><span id="player-year"></span></p>
        <div class="timeline">
          <div id="ticks" class="ticks" aria-hidden="true"></div>
          <input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Song position">
          <div id="years" class="years" aria-hidden="true"></div>
        </div>
        <div class="controls">
          <time id="elapsed">0:00</time>
          <button id="toggle" class="toggle" type="button" aria-label="Pause"><span aria-hidden="true">Ⅱ</span></button>
          <time id="duration">0:00</time>
        </div>
        <p id="playing-credit" class="demo-credit playing-credit" hidden>“Chaoz Fantasy” by <a href="https://www.newgrounds.com/audio/listen/85046" target="_blank" rel="noopener noreferrer">ParagonX9</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 3.0</a></p>
      </footer>
    </section>
    <p id="message" class="message" role="status" hidden></p>
    <audio id="audio" preload="metadata"></audio>
  </main>
</body>
</html>
